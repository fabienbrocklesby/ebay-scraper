[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebay-scraper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.7",
    "beautifulsoup4>=4.12",
    "rq>=1.16",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
scraper = "scraper.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["scraper*"]

[tool.setuptools.package-data]
scraper = ["coordinator-compose.yml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
