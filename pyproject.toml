[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebay-scraper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "rq>=1.16",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.scripts]
scraper = "scraper.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["scraper*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
