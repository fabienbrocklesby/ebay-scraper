services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
      POSTGRES_DB: ebayscraper
    ports:
      - "5432:5432"
    volumes:
      - ebay_scraper_postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  ebay_scraper_postgres:
